<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}VaultLock{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    
<header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}">
        <span class="brand-mark">V</span> VaultLock
    </a>
    {% if session.get('user_id') %}
    <nav>
        <a href="{{ url_for('dashboard') }}">Vault</a>
        <a href="{{ url_for('security') }}">Security</a>
        <a href="{{ url_for('new_entry') }}" class="nav-add">+ Add</a>
        <a href="{{ url_for('logout') }}">Lock</a>
    </nav>
    {% endif %}
</header>

<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
